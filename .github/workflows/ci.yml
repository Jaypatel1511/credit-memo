name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request opened from a branch in this repository also fires `push` on
# that branch, so without this guard every same-repo PR ran the whole workflow
# twice. A pull request from a fork produces no `push` event here, so it still
# needs its `pull_request` run — hence a filter rather than dropping the
# trigger. Pushes to any branch keep running, PR or no PR.

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[docx]" pytest
      - name: Run tests
        # CREDITMEMO_REQUIRE_DOCX makes conftest raise instead of letting the
        # .docx gates skip silently if python-docx is missing.
        env:
          CREDITMEMO_REQUIRE_DOCX: "1"
        run: python -m pytest tests/ -q

  package:
    name: distributions are shippable, and the built wheel renders .docx tables
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check distribution contents and metadata
        # Fails if a top-level package other than creditmemo is installed
        # (0.1.0 shipped `tests`), if [project] metadata came out UNKNOWN, or if
        # the sdist is missing the files MANIFEST.in adds — without them its
        # test suite cannot run.
        run: python scripts/check_wheel.py dist/*.whl dist/*.tar.gz

      # The smoke check installs the SAME wheel the step above validated. It
      # used to live in a separate job with `needs: package`, which orders the
      # jobs but hands nothing over, so that job rebuilt the wheel and smoke
      # tested an artifact nothing had checked.
      - name: Install the checked wheel
        run: python -m pip install dist/*.whl python-docx
      - name: Confirm no stray top-level package was installed
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import sys
          try:
              import tests
          except ImportError:
              sys.exit(0)
          sys.exit("credit-memo installed a top-level 'tests' package: %s" % tests.__file__)
          PY
      - name: Render the README deal and assert the tables survived
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/smoke_installed_wheel.py" "$RUNNER_TEMP/smoke.docx"
