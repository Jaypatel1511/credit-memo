name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[docx]" pytest
      - name: Run tests
        # CREDITMEMO_REQUIRE_DOCX makes conftest raise instead of letting the
        # .docx gates skip silently if python-docx is missing.
        env:
          CREDITMEMO_REQUIRE_DOCX: "1"
        run: python -m pytest tests/ -q

  package:
    name: wheel is shippable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check wheel contents and metadata
        # Fails if a top-level package other than creditmemo is installed
        # (0.1.0 shipped `tests`), or if [project] metadata came out UNKNOWN.
        run: python scripts/check_wheel.py dist/*.whl

  smoke:
    name: installed wheel renders .docx tables
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Build and install the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m pip install dist/*.whl python-docx
      - name: Confirm no stray top-level package was installed
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import sys
          try:
              import tests
          except ImportError:
              sys.exit(0)
          sys.exit("credit-memo installed a top-level 'tests' package: %s" % tests.__file__)
          PY
      - name: Render the README deal and assert the tables survived
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/smoke_installed_wheel.py" "$RUNNER_TEMP/smoke.docx"
