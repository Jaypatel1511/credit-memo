name: Release

# Release / publish pipeline, modelled on nmtc-mapper's release.yml and adapted
# to this repository. Two triggers:
#
#   push of a version tag (v*)  -> every gate, then publish to PyPI
#   workflow_dispatch           -> every gate, publish SKIPPED (a dry run)
#
#   verify-version ─> build ─┬─> test-wheel ─┬─> twine-check ─> publish
#                            └─> test-sdist ─┘                  (tag only)
#
# The dry run exists because a release job is proven on a runner BEFORE a tag
# depends on it: run this workflow from the Actions tab on the branch you are
# about to tag, and tag only once it is green. A tag is the one irreversible
# step (PyPI versions are permanent); a failed dispatch costs nothing.
#
# The two test jobs answer different questions and neither can answer the
# other's:
#   test-wheel  "does the installed wheel work on every supported Python?"
#   test-sdist  "is the source distribution complete?" -- which test-wheel
#               structurally CANNOT answer, because it sources tests/ from the
#               git checkout, so a tarball shipping no tests would still pass.
#
# Working principle: a gate must consume the artifact it certifies. Both test
# jobs run the suite from a directory holding ONLY tests/, pyproject.toml and
# README.md, with the package supplied by the installed artifact, so the import
# cannot resolve to the source tree. Gates that read setup.py or creditmemo/*.py
# from the checkout are marked `repo` and deselected there (see pyproject.toml
# and tests/test_repo_marker.py); ci.yml, which runs from the checkout, keeps
# every one of them.
#
# Adapted from nmtc-mapper, NOT copied:
#   * no `live` marker -- credit-memo makes no network calls, so the release
#     expression is `-m "not repo"`, not `-m "not live and not repo"`;
#   * no docs-check job -- this repo has no tools/docs_check.py. Its README
#     claims are gated by ordinary tests (tests/test_docx.py and
#     tests/test_input_fidelity.py read README.md), and those run in BOTH test
#     jobs because README.md ships beside tests/ in every layout;
#   * a two-source version guard -- creditmemo/__init__.py carries a literal
#     __version__ (nmtc-mapper derives it from importlib.metadata), so the tag
#     is compared to pyproject.toml AND to that literal;
#   * the python-docx extra is installed and CREDITMEMO_REQUIRE_DOCX=1 is set,
#     exactly as in ci.yml, so the .docx gates cannot skip to green;
#   * scripts/check_wheel.py and scripts/smoke_installed_wheel.py, which ci.yml
#     already runs, are run here against the artifact being released.
#
# Publishing is OIDC Trusted Publisher only (no API token). The Trusted
# Publisher on pypi.org must be registered against owner `Jaypatel1511`,
# repository `credit-memo`, workflow file `release.yml` and environment `pypi`
# -- the filename of THIS file and the `environment:` key on the publish job
# are both load-bearing for the OIDC claim match.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least privilege by default; only `publish` overrides this.
permissions:
  contents: read

jobs:
  # ── 1. Version drift guard ────────────────────────────────────────────────
  # credit-memo has TWO declared version literals and one that must stay absent:
  #   pyproject.toml [project].version   <- literal
  #   creditmemo/__init__.py __version__ <- literal (tests/test_packaging.py
  #                                         gates it equal to pyproject.toml)
  #   setup.py                           <- bare shim, must declare no version
  # On a tag, both literals must equal the tag. On a dispatch there is no tag,
  # so the two literals must equal each other, and pyproject's value becomes
  # the expected version for every downstream job.
  verify-version:
    name: Verify version sources (tag, pyproject.toml, __init__.py)
    # Runner pinned, not `ubuntu-latest`: actions/python-versions ships NO Python
    # 3.9 build for ubuntu-26.04, and the `ubuntu-latest` label moves to Ubuntu 26
    # on 2026-10-19. Remove this pin once this repo's Python floor rises above 3.9
    # and every version in every matrix here has an ubuntu-26.04 build.
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.guard.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compare version sources
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, os, pathlib, sys, tomllib

          with open("pyproject.toml", "rb") as fh:
              declared = tomllib.load(fh)["project"]["version"]

          # ast.walk, not .body: a literal nested in a try/except would be
          # invisible to a top-level-only scan (nmtc-mapper shipped exactly
          # that false assurance once). Exactly one literal is expected.
          init_tree = ast.parse(pathlib.Path("creditmemo/__init__.py").read_text())
          literals = []
          for node in ast.walk(init_tree):
              if isinstance(node, ast.Assign):
                  targets, value = node.targets, node.value
              elif isinstance(node, ast.AnnAssign):
                  targets, value = [node.target], node.value
              else:
                  continue
              if any(isinstance(t, ast.Name) and t.id == "__version__" for t in targets):
                  literals.append((node.lineno, value))

          failed = False
          if len(literals) != 1 or not isinstance(literals[0][1], ast.Constant):
              print(f"::error::creditmemo/__init__.py must assign __version__ exactly once, "
                    f"as a string literal; found {len(literals)} assignment(s)")
              sys.exit(1)
          dunder = literals[0][1].value

          if os.environ["EVENT"] == "push":
              if os.environ["REF_TYPE"] != "tag":
                  print("::error::push event that is not a tag reached release.yml")
                  sys.exit(1)
              tag = os.environ["TAG"]
              expected = tag[1:] if tag.startswith("v") else tag
              print(f"{'git tag':<28}: {tag}")
          else:
              expected = declared
              print(f"{'event':<28}: {os.environ['EVENT']} (dry run, no tag)")
          print(f"{'expected version':<28}: {expected}")
          print(f"{'pyproject.toml':<28}: {declared}")
          print(f"{'creditmemo/__init__.py':<28}: {dunder}")

          if declared != expected:
              print(f"::error::pyproject.toml declares '{declared}', expected '{expected}'")
              failed = True
          if dunder != expected:
              print(f"::error::creditmemo/__init__.py declares '{dunder}', expected '{expected}'")
              failed = True

          setup_src = pathlib.Path("setup.py").read_text()
          for node in ast.walk(ast.parse(setup_src)):
              if isinstance(node, ast.Call) and getattr(node.func, "id", None) == "setup":
                  for kw in node.keywords:
                      if kw.arg == "version":
                          print("::error::setup.py has grown a version= kwarg; it must stay a bare shim")
                          failed = True

          if failed:
              print("::error::Fix: bump both literals, commit, delete the tag, re-tag, push again.")
              sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={expected}\n")
          print(f"Version guard passed: {expected}")
          PY

  # ── 2. Build once ─────────────────────────────────────────────────────────
  build:
    name: Build wheel and sdist
    needs: [verify-version]
    # Runner pinned, not `ubuntu-latest`: actions/python-versions ships NO Python
    # 3.9 build for ubuntu-26.04, and the `ubuntu-latest` label moves to Ubuntu 26
    # on 2026-10-19. Remove this pin once this repo's Python floor rises above 3.9
    # and every version in every matrix here has an ubuntu-26.04 build.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          set -euo pipefail
          python -m pip install build
          python -m build
          ls -l dist/

      # The same contents/metadata check ci.yml's `package` job runs: no stray
      # top-level package, no UNKNOWN metadata, wheel/sdist versions match the
      # source, and the sdist carries every file MANIFEST.in adds.
      - name: Check distribution contents and metadata
        run: python scripts/check_wheel.py dist/*.whl dist/*.tar.gz

      # Exact set comparison of test modules, checkout vs sdist. NOTE: this
      # alone certifies little -- setuptools' legacy sdist default already
      # matches tests/test*.py -- the files it cannot see (tests/conftest.py,
      # tests/__init__.py) are asserted by check_wheel.py above and again by
      # the required-files loop in test-sdist.
      - name: Assert the sdist ships every test module in the checkout
        shell: bash
        run: |
          set -euo pipefail
          SDIST="$(ls dist/*.tar.gz)"
          find tests -name 'test_*.py' | sed 's|^|/|' | sort > "${RUNNER_TEMP}/repo-tests.txt"
          # grep exits 1 on no-match (tolerated so the emptiness check below
          # produces the real message) and 2 on error (fatal).
          tar tzf "${SDIST}" | sed 's|^[^/]*||' \
            | { grep -E '^/tests/(.*/)?test_[^/]*\.py$' || test $? -eq 1; } | sort \
            > "${RUNNER_TEMP}/sdist-tests.txt"
          echo "test modules in checkout : $(wc -l < "${RUNNER_TEMP}/repo-tests.txt")"
          echo "test modules in sdist    : $(wc -l < "${RUNNER_TEMP}/sdist-tests.txt")"
          if [ ! -s "${RUNNER_TEMP}/sdist-tests.txt" ]; then
            echo "::error::sdist ships no test modules at all — MANIFEST.in matches nothing"
            exit 1
          fi
          MISSING="$(comm -23 "${RUNNER_TEMP}/repo-tests.txt" "${RUNNER_TEMP}/sdist-tests.txt")"
          if [ -n "${MISSING}" ]; then
            echo "::error::sdist is missing test modules that exist in the checkout:"
            echo "${MISSING}"
            exit 1
          fi
          echo "sdist ships every test module in the checkout"

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # ── 3. Test the built WHEEL on every supported Python ─────────────────────
  test-wheel:
    name: test wheel (py${{ matrix.python-version }})
    needs: [verify-version, build]
    # Runner pinned, not `ubuntu-latest`: actions/python-versions ships NO Python
    # 3.9 build for ubuntu-26.04, and the `ubuntu-latest` label moves to Ubuntu 26
    # on 2026-10-19. Remove this pin once this repo's Python floor rises above 3.9
    # and every version in every matrix here has an ubuntu-26.04 build.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Mirrors ci.yml's matrix and pyproject's requires-python = ">=3.9".
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      # conftest.py raises instead of letting the .docx gates skip when
      # python-docx is missing -- same setting as ci.yml.
      CREDITMEMO_REQUIRE_DOCX: "1"
    steps:
      - name: Checkout (for tests/ and scripts/ only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Install the wheel into a fresh venv and test it
        shell: bash
        env:
          EXPECTED: ${{ needs.verify-version.outputs.version }}
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/wheel-venv"
          VPY="${RUNNER_TEMP}/wheel-venv/bin/python"
          "${VPY}" -m pip install --upgrade pip
          WHEEL="$(ls dist/*.whl)"
          echo "Installing wheel: ${WHEEL}[docx]"
          "${VPY}" -m pip install "${WHEEL}[docx]" pytest

          # Run from a directory holding ONLY tests/, pyproject.toml (it
          # registers the `repo` marker, which --strict-markers requires) and
          # README.md (read by the README-claim gates, and shipped in every
          # layout). NOT setup.py, NOT creditmemo/: gates that need those are
          # `repo` and deselected -- copying the source in would make this job
          # test the checkout again.
          TESTDIR="${RUNNER_TEMP}/wheel-tests"
          mkdir -p "${TESTDIR}"
          cp -R tests "${TESTDIR}/tests"
          cp pyproject.toml README.md "${TESTDIR}/"
          cp scripts/smoke_installed_wheel.py "${RUNNER_TEMP}/smoke_installed_wheel.py"
          cd "${TESTDIR}"

          ORIGIN="$("${VPY}" -c 'import creditmemo; print(creditmemo.__file__)')"
          echo "import resolved to    : ${ORIGIN}"
          case "${ORIGIN}" in
            *"/site-packages/"*) ;;
            *) echo "::error::import creditmemo resolved to '${ORIGIN}', not the installed wheel"; exit 1 ;;
          esac

          INSTALLED="$("${VPY}" -c 'import creditmemo; print(creditmemo.__version__)')"
          echo "installed __version__ : ${INSTALLED}"
          echo "expected              : ${EXPECTED}"
          if [ "${INSTALLED}" != "${EXPECTED}" ]; then
            echo "::error::Installed wheel reports '${INSTALLED}', expected '${EXPECTED}'"
            exit 1
          fi

          "${VPY}" -m pytest tests -q --tb=short -m "not repo" --import-mode=importlib --strict-markers

          # The README deal rendered to .docx by the installed wheel, with the
          # table-survival assertions ci.yml's `package` job runs.
          "${VPY}" "${RUNNER_TEMP}/smoke_installed_wheel.py" "${RUNNER_TEMP}/smoke.docx"

  # ── 4. Test the built SDIST, running the suite THAT SHIPPED INSIDE IT ─────
  # Nothing in this job comes from the repository.
  test-sdist:
    name: test sdist (py${{ matrix.python-version }})
    needs: [verify-version, build]
    # Runner pinned, not `ubuntu-latest`: actions/python-versions ships NO Python
    # 3.9 build for ubuntu-26.04, and the `ubuntu-latest` label moves to Ubuntu 26
    # on 2026-10-19. Remove this pin once this repo's Python floor rises above 3.9
    # and every version in every matrix here has an ubuntu-26.04 build.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      CREDITMEMO_REQUIRE_DOCX: "1"
    steps:
      # NOTE: deliberately NO actions/checkout, so it cannot leak into the
      # thing under test.
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Unpack the sdist, install it, and run its own suite
        shell: bash
        env:
          EXPECTED: ${{ needs.verify-version.outputs.version }}
        run: |
          set -euo pipefail
          SDIST="$(ls dist/*.tar.gz)"
          echo "sdist under test: ${SDIST}"

          WORK="${RUNNER_TEMP}/sdist-work"
          mkdir -p "${WORK}"
          tar xzf "${SDIST}" -C "${WORK}"
          SRC="$(find "${WORK}" -maxdepth 1 -mindepth 1 -type d)"
          echo "--- files the sdist actually contains ---"
          tar tzf "${SDIST}"

          for required in tests/conftest.py tests/__init__.py README.md pyproject.toml; do
            if [ ! -f "${SRC}/${required}" ]; then
              echo "::error::sdist is missing ${required} — check MANIFEST.in"
              exit 1
            fi
          done

          python -m venv "${RUNNER_TEMP}/sdist-venv"
          VPY="${RUNNER_TEMP}/sdist-venv/bin/python"
          "${VPY}" -m pip install --upgrade pip
          "${VPY}" -m pip install "${SDIST}[docx]" pytest

          # Only what the sdist shipped, and NOT ./creditmemo: running from
          # ${SRC} would put the unpacked source tree on sys.path. The tarball
          # also ships setup.py and scripts/; they are deliberately not copied
          # -- the `repo` gates that read setup.py are deselected below.
          TESTDIR="${RUNNER_TEMP}/sdist-tests"
          mkdir -p "${TESTDIR}"
          cp -R "${SRC}/tests" "${TESTDIR}/tests"
          cp "${SRC}/README.md" "${SRC}/pyproject.toml" "${TESTDIR}/"
          cd "${TESTDIR}"

          ORIGIN="$("${VPY}" -c 'import creditmemo; print(creditmemo.__file__)')"
          echo "import resolved to    : ${ORIGIN}"
          case "${ORIGIN}" in
            *"/site-packages/"*) ;;
            *) echo "::error::import creditmemo resolved to '${ORIGIN}', not the installed sdist"; exit 1 ;;
          esac

          INSTALLED="$("${VPY}" -c 'import creditmemo; print(creditmemo.__version__)')"
          if [ "${INSTALLED}" != "${EXPECTED}" ]; then
            echo "::error::Installed sdist reports '${INSTALLED}', expected '${EXPECTED}'"
            exit 1
          fi

          "${VPY}" -m pytest tests -q -m "not repo" --import-mode=importlib --strict-markers \
            --junitxml="${RUNNER_TEMP}/sdist-junit.xml"

      - name: Assert the sdist suite is not silently truncated
        shell: bash
        run: |
          set -euo pipefail
          # A suite where every test is deselected or skipped exits 0 while
          # shipping every module it should, so count EXECUTIONS, not modules.
          #
          # FLOOR DERIVATION: half of what this job's exact invocation executes
          # today, floored. Measured locally on the sdist built from this commit
          # (CPython 3.11, python-docx installed, CREDITMEMO_REQUIRE_DOCX=1):
          # 530 collected, 8 deselected as `repo`, 1 skipped (a pandas
          # importorskip that is correct to skip) -> 521 executed. 521 / 2 = 260.
          # Re-derive whenever the suite resizes.
          FLOOR=260
          EXECUTED="$(python - "${RUNNER_TEMP}/sdist-junit.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = root.findall("testsuite") if root.tag == "testsuites" else [root]
          total = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          print(total - skipped)
          PY
          )"
          echo "tests actually executed: ${EXECUTED}  (floor ${FLOOR})"
          if [ "${EXECUTED}" -lt "${FLOOR}" ]; then
            echo "::error::the sdist suite executed only ${EXECUTED} tests, below the floor of ${FLOOR}."
            echo "::error::Check for a marker change or an -m expression that deselected the suite."
            exit 1
          fi

  # ── 5. Metadata gate ──────────────────────────────────────────────────────
  twine-check:
    name: twine check (sdist + wheel)
    needs: [test-wheel, test-sdist]
    # Runner pinned, not `ubuntu-latest`: actions/python-versions ships NO Python
    # 3.9 build for ubuntu-26.04, and the `ubuntu-latest` label moves to Ubuntu 26
    # on 2026-10-19. Remove this pin once this repo's Python floor rises above 3.9
    # and every version in every matrix here has an ubuntu-26.04 build.
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: twine check --strict
        run: |
          set -euo pipefail
          python -m pip install twine
          ls -l dist/
          python -m twine check --strict dist/*

  # ── 6. Publish (tag pushes only; skipped on a workflow_dispatch dry run) ──
  publish:
    name: Publish to PyPI (Trusted Publisher / OIDC)
    needs: [verify-version, build, test-wheel, test-sdist, twine-check]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # Runner pinned, not `ubuntu-latest`: actions/python-versions ships NO Python
    # 3.9 build for ubuntu-26.04, and the `ubuntu-latest` label moves to Ubuntu 26
    # on 2026-10-19. Remove this pin once this repo's Python floor rises above 3.9
    # and every version in every matrix here has an ubuntu-26.04 build.
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/credit-memo/
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          # Default is already true on v1.11+; stated explicitly so a future
          # action upgrade cannot silently drop provenance.
          attestations: true
