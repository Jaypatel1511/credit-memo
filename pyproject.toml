[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-memo"
version = "0.2.2"
description = "Generate IC credit memos from structured deal inputs — CDFI loans, NMTC deals, and impact investments"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
# credit-memo builds strings and, optionally, a Word document. It imports
# nothing outside the standard library. 0.2.0 and 0.1.0 declared a hard
# dependency on pandas that no module in the package ever imported, so every
# install pulled pandas and numpy for nothing and inherited their platform
# constraints.
dependencies = []

[project.optional-dependencies]
docx = ["python-docx>=0.8.11"]

[project.urls]
Homepage = "https://github.com/Jaypatel1511/credit-memo"

[tool.setuptools.packages.find]
where = ["."]
include = ["creditmemo*"]

[tool.pytest.ini_options]
markers = [
    # `repo`: this gate reads the REPOSITORY -- setup.py or the source tree
    # under creditmemo/ -- and is meaningless in a packaged layout.
    # release.yml's test-wheel and test-sdist jobs deliberately run the suite
    # from a directory holding only tests/, pyproject.toml and README.md (that
    # exclusion is what makes them prove the artifact rather than the
    # checkout), so they deselect these with `-m "not repo"`. ci.yml runs from
    # the checkout and keeps every one of them. A gate that reads only
    # README.md or pyproject.toml is NOT repo: both ship beside tests/ in every
    # layout. tests/test_repo_marker.py pins the marked set in both directions.
    "repo: reads setup.py or creditmemo/*.py from the checkout; release.yml runs -m \"not repo\" in its packaged layouts",
]
